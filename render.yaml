services:
  - type: web
    name: wegolden-philippines
    runtime: static
    staticPublishPath: ./
    buildCommand: ""
    routes:
      - type: rewrite
        source: /en
        destination: /en/index.html
      - type: rewrite
        source: /tl
        destination: /tl/index.html
      - type: rewrite
        source: /en/*
        destination: /en/:splat
      - type: rewrite
        source: /tl/*
        destination: /tl/:splat
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
